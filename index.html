<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیران - مصالح ساختمانی احمدی</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#eef2f5;color:#17202a}header{background:#173a63;color:#fff;padding:14px;text-align:center}nav{display:flex;gap:5px;overflow:auto;background:#fff;padding:8px;position:sticky;top:0;z-index:5}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #ccd4dc;border-radius:6px}button{font-weight:bold;cursor:pointer}.p{background:#173f73;color:#fff}.g{background:#197645;color:#fff}.r{background:#a33;color:#fff}.page{display:none;padding:12px;max-width:1100px;margin:auto}.on{display:block}.card{background:#fff;padding:14px;border-radius:9px;margin-bottom:12px;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;font-weight:bold;font-size:13px;margin-bottom:4px}.item{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:5px;margin:7px 0;align-items:center}.line{border:1px solid #ddd;padding:9px;margin:6px 0;border-radius:6px}.sum{background:#f1f5f8;padding:9px;margin-top:8px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #999;padding:6px;text-align:center}th{background:#173a63;color:#fff}#print{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item select{grid-column:1/-1}}@media print{@page{size:A6 portrait;margin:0}body>*:not(#print){display:none!important}#print{display:block!important}.ah{width:101mm;height:144mm;margin:2mm auto;border:1px solid #173a63;padding:2mm;color:#173a63;font-weight:900;font-size:9px;overflow:hidden}.hd{text-align:center;border-bottom:1px solid #173a63;padding-bottom:1mm}.brand h3{margin:0;font-size:13px}.slog{text-align:center;margin:1mm}.ttl{background:#173a63;color:#fff;text-align:center;padding:1mm;margin:1mm}.top,.people,.totals{display:grid;grid-template-columns:1fr 1fr;gap:1mm}.box,.person,.addr,.tbox,.notes,.signs{border:1px solid #173a63;padding:1mm}.addr,.notes{margin-top:1mm}.tbl{width:100%;font-size:7px;margin-top:1mm}.tbl th,.tbl td{border:1px solid #173a63;padding:1mm}.signs{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:1mm}.sign{text-align:center;padding:2mm}}

.loginMask{position:fixed;inset:0;background:#173a63;display:flex;align-items:center;justify-content:center;z-index:9999}.loginBox{width:min(92%,380px);background:#fff;border-radius:14px;padding:24px;box-shadow:0 10px 40px #0005;text-align:center}.loginBox h2{margin-top:0}.loginBox input{display:block;width:100%;margin:10px 0}.loginBox button{width:100%;margin-top:8px}.loginErr{color:#a33;font-weight:bold;min-height:24px}.managerBar{background:#fff;padding:6px 10px;text-align:center;font-weight:bold;color:#173a63}.approvalActions button{margin:3px}.printLogo{display:flex;justify-content:center;align-items:center;gap:5px;margin-bottom:1mm}.printLogo svg{width:18mm;height:12mm}.printLogoText{font-size:13px;font-weight:900}.</style></head><body><div id="loginMask" class="loginMask"><div class="loginBox"><h2>پنل مدیران</h2><div>مصالح ساختمانی احمدی</div><input id="loginUser" placeholder="نام کاربری" autocomplete="username"><input id="loginPass" type="password" placeholder="رمز عبور" autocomplete="current-password"><div id="loginErr" class="loginErr"></div><button class="p" onclick="doLogin()">ورود به پنل</button></div></div><header><h2>مصالح ساختمانی احمدی</h2><small>سیستم سفارش، حواله و انبار</small></header><div id="managerBar" class="managerBar"></div><nav><button onclick="P('order')">ثبت سفارش</button><button onclick="P('orders')">حواله‌ها</button><button onclick="P('customers')">مشتریان</button><button onclick="P('ledger')">حساب معین</button><button onclick="P('finance')">مالی</button><button onclick="P('drivers')">رانندگان</button><button onclick="P('goods')">کالا و انبار</button><button onclick="P('cardex')">کاردکس</button><button onclick="P('backup')">پشتیبان</button><button onclick="P('approvals');loadApprovals()">تأیید کیوسک</button></nav>
<div id="order" class="page on"><div class="card"><h3>ثبت سفارش و حواله</h3><input id="oid" type="hidden"><div class="grid"><div><label>نوع مشتری</label><select id="type" onchange="typeCh()"><option value="cash">مشتری نقدی انبار</option><option value="office">مشتری دفتر</option></select></div><div><label>شماره حواله</label><input id="no" readonly></div><div><label>تاریخ و ساعت</label><input id="date" readonly></div><div><label>مشتری</label><select id="cust" onchange="custCh()"></select></div><div><label>موبایل</label><input id="mobile" readonly></div><div><label>آدرس</label><input id="address" readonly></div></div><div id="driverbox" class="grid"><div><label>راننده</label><select id="driver" onchange="drvCh()"></select></div><div><label>پلاک</label><input id="plate" readonly></div></div><h3>کالاها</h3><div id="items"></div><button class="g" onclick="addItem()">+ افزودن کالا</button><div id="cashbox" class="sum">جمع کل: <b id="total">۰</b> تومان | بدهی قبلی: <b id="debt">۰</b> تومان<br><label>مبلغ پرداختی</label><input id="payment" inputmode="numeric" oninput="dig(this);calc()"> | مانده: <b id="balance">۰</b> تومان</div><label>توضیحات</label><textarea id="notes"></textarea><p><button class="p" onclick="saveOrder()">ثبت / اصلاح حواله</button><button class="g" onclick="printOrder()">مشاهده و چاپ</button><button class="r" onclick="delOrder()">حذف</button><button onclick="newOrder()">حواله جدید</button></p></div></div>

<script>const K='mahyar_ahmadi_v3';let D={customers:[],drivers:[],goods:[],orders:[],stock:[],finance:[]};let I=[];const $=x=>document.getElementById(x),N=x=>Number(String(x??'').replace(/[٬,،\s]/g,'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))||0,M=x=>N(x).toLocaleString('fa-IR'),ID=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),NOW=()=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date());function dig(x){x.value=x.value.replace(/[^0-9۰-۹]/g,'')}function save(){localStorage.setItem(K,JSON.stringify(D)); if(window.AUTH){ return fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Basic '+window.AUTH},body:JSON.stringify(D)}).then(r=>{if(!r.ok)throw new Error('save failed');return r.json()}).catch(e=>{console.error(e);alert('ذخیره روی سرور انجام نشد');throw e}) } return Promise.resolve({ok:true})}function P(x){document.querySelectorAll('.page').forEach(a=>a.classList.remove('on'));$(x).classList.add('on');R()}function NO(){return D.orders.reduce((a,o)=>Math.max(a,N(o.no)),0)+1}function ST(g){let z=D.goods.find(x=>x.id===g),v=N(z?.opening);D.stock.filter(x=>x.gid===g).forEach(x=>v+=N(x.qty));D.orders.forEach(o=>(o.items||[]).forEach(i=>{if(i.gid===g)v-=N(i.qty)}));return v}function balanceOf(c,ex){let z=D.customers.find(x=>x.id===c),b=N(z?.openingDebit)-N(z?.openingCredit);D.orders.forEach(o=>{if(o.id!==ex&&o.cid===c&&o.type==='cash')b+=N(o.total)-N(o.payment)});D.finance.forEach(x=>{if(x.cid===c)b+=x.type==='pay'?N(x.amount):-N(x.amount)});return b}function fill(){let t=$('type').value;$('cust').innerHTML='<option value="">انتخاب مشتری</option>'+D.customers.filter(x=>x.type===t).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('driver').innerHTML='<option value="">انتخاب راننده</option>'+D.drivers.map(x=>`<option value="${x.id}">${x.name} - ${x.plate||''}</option>`).join('');let o='<option value="">انتخاب کالا</option>'+D.goods.map(g=>`<option value="${g.id}">${g.name} | موجودی ${M(ST(g.id))}</option>`).join('');$('sg').innerHTML=o;$('cg').innerHTML=o;$('ledgerCustomer').innerHTML='<option value="">انتخاب مشتری</option>'+D.customers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('finCustomer').innerHTML='<option value="">انتخاب مشتری</option>'+D.customers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}function typeCh(){let c=$('type').value==='cash';$('driverbox').style.display=c?'none':'grid';$('cashbox').style.display=c?'block':'none';fill();draw()}function custCh(){let x=D.customers.find(a=>a.id===$('cust').value);$('mobile').value=x?.mobile||'';$('address').value=x?.address||'';calc()}function drvCh(){let x=D.drivers.find(a=>a.id===$('driver').value);$('plate').value=x?.plate||''}function addItem(){I.push({gid:'',qty:'',price:''});draw()}function draw(){$('items').innerHTML='';I.forEach((x,k)=>{let r=document.createElement('div');r.className='item';let s=document.createElement('select');s.innerHTML='<option value="">کالا</option>'+D.goods.map(g=>`<option value="${g.id}" ${x.gid===g.id?'selected':''}>${g.name}</option>`).join('');s.onchange=()=>{I[k].gid=s.value;draw()};let q=document.createElement('input');q.placeholder='تعداد';q.value=x.qty;q.oninput=()=>{dig(q);I[k].qty=q.value;calc()};let p=document.createElement('input');p.placeholder='قیمت واحد';p.value=x.price;p.oninput=()=>{dig(p);I[k].price=p.value;calc()};p.disabled=$('type').value!=='cash';let a=document.createElement('div');a.textContent=M(N(x.qty)*N(x.price));let b=document.createElement('button');b.textContent='حذف';b.className='r';b.onclick=()=>{I.splice(k,1);draw()};r.append(s,q,p,a,b);$('items').append(r)});calc()}function calc(){let t=I.reduce((s,x)=>s+N(x.qty)*N(x.price),0),d=balanceOf($('cust').value,$('oid').value);$('total').textContent=M(t);$('debt').textContent=M(d);$('balance').textContent=M(d+t-N($('payment').value))}function newOrder(){$('oid').value='';$('no').value=NO();$('date').value=NOW();$('payment').value='';$('notes').value='';I=[];fill();typeCh()}function saveOrder(){let c=D.customers.find(x=>x.id===$('cust').value);if(!c||!I.length){alert('مشتری و کالا را انتخاب کنید');return}let id=$('oid').value||ID(),old=D.orders.find(x=>x.id===id),o={id,no:old?.no||NO(),date:$('date').value||NOW(),type:$('type').value,cid:c.id,customer:c.name,mobile:c.mobile||'',address:c.address||'',driverId:$('driver').value||'',driver:D.drivers.find(x=>x.id===$('driver').value)?.name||'',plate:$('plate').value||'',items:I.map(x=>({...x,qty:N(x.qty),price:N(x.price)})),total:I.reduce((s,x)=>s+N(x.qty)*N(x.price),0),payment:N($('payment').value),notes:$('notes').value||''};let i=D.orders.findIndex(x=>x.id===id);if(i>=0)D.orders[i]=o;else D.orders.push(o);$('oid').value=id;$('no').value=o.no;save();R();alert('حواله ثبت شد')}function loadO(id){let o=D.orders.find(x=>x.id===id);if(!o)return;P('order');$('oid').value=o.id;$('no').value=o.no;$('date').value=o.date;$('type').value=o.type;fill();$('cust').value=o.cid;$('payment').value=o.payment||'';$('notes').value=o.notes||'';I=o.items||[];typeCh();$('cust').value=o.cid;custCh();$('driver').value=o.driverId||'';drvCh();draw()}function delOrder(){let id=$('oid').value;if(!id){alert('ابتدا حواله را انتخاب کنید');return}if(confirm('حواله حذف شود؟')){D.orders=D.orders.filter(x=>x.id!==id);save();R();newOrder();alert('حذف شد')}}function deleteSavedOrder(id){if(confirm('حواله حذف شود؟')){D.orders=D.orders.filter(x=>x.id!==id);save();R()}}function saveCust(){let name=$('cn').value.trim();if(!name)return alert('نام مشتری را وارد کنید');let id=$('cid').value||ID(),o={id,name,type:$('ct').value,mobile:$('cp').value,address:$('ca').value,openingDebit:N($('cDebit').value),openingCredit:N($('cCredit').value)};let i=D.customers.findIndex(x=>x.id===id);if(i>=0)D.customers[i]=o;else D.customers.push(o);save();R();['cid','cn','cp','ca','cDebit','cCredit'].forEach(x=>$(x).value='');alert('مشتری ذخیره شد')}function editCust(id){let x=D.customers.find(a=>a.id===id);$('cid').value=x.id;$('cn').value=x.name;$('ct').value=x.type;$('cp').value=x.mobile||'';$('ca').value=x.address||'';$('cDebit').value=x.openingDebit||'';$('cCredit').value=x.openingCredit||''}function deleteCust(id){if(confirm('مشتری حذف شود؟')){D.customers=D.customers.filter(x=>x.id!==id);save();R()}}function saveDrv(){let name=$('dn').value.trim();if(!name)return alert('نام راننده را وارد کنید');let id=$('did').value||ID(),o={id,name,mobile:$('dp').value,vehicle:$('dv').value,plate:$('dpl').value};let i=D.drivers.findIndex(x=>x.id===id);if(i>=0)D.drivers[i]=o;else D.drivers.push(o);save();R();['did','dn','dp','dv','dpl'].forEach(x=>$(x).value='');alert('راننده ذخیره شد')}function editDrv(id){let x=D.drivers.find(a=>a.id===id);$('did').value=x.id;$('dn').value=x.name;$('dp').value=x.mobile||'';$('dv').value=x.vehicle||'';$('dpl').value=x.plate||''}function deleteDrv(id){if(confirm('راننده حذف شود؟')){D.drivers=D.drivers.filter(x=>x.id!==id);save();R()}}function saveGood(){let name=$('gn').value.trim();if(!name)return alert('نام کالا را وارد کنید');let id=$('gid').value||ID(),o={id,name,unit:$('gu').value||'کیسه',opening:N($('go').value)};let i=D.goods.findIndex(x=>x.id===id);if(i>=0)D.goods[i]=o;else D.goods.push(o);save();R();['gid','gn','go'].forEach(x=>$(x).value='');alert('کالا ذخیره شد')}function editGood(id){let x=D.goods.find(a=>a.id===id);$('gid').value=x.id;$('gn').value=x.name;$('gu').value=x.unit;$('go').value=x.opening||''}function deleteGood(id){if(confirm('کالا حذف شود؟')){D.goods=D.goods.filter(x=>x.id!==id);D.stock=D.stock.filter(x=>x.gid!==id);save();R()}}function stockIn(){let gid=$('sg').value,q=N($('sq').value);if(!gid||q<=0)return alert('کالا و تعداد را وارد کنید');D.stock.push({id:ID(),gid,qty:q,date:NOW()});save();R();$('sq').value='';alert('ورود ثبت شد')}function saveFinance(){let cid=$('finCustomer').value,a=N($('finAmount').value);if(!cid||a<=0)return alert('مشتری و مبلغ را وارد کنید');D.finance.push({id:ID(),cid,type:$('finType').value,amount:a,date:$('finDate').value||NOW(),desc:$('finDesc').value});save();R();$('finAmount').value='';$('finDesc').value='';alert('ثبت شد')}function customerLedger(){let cid=$('ledgerCustomer').value;if(!cid)return;$('ledgerBalance').value=M(balanceOf(cid))+' تومان';$('ledgerList').innerHTML=D.orders.filter(x=>x.cid===cid).map(x=>`<div class="line">حواله ${M(x.no)} — ${x.date} — ${M(x.total)} تومان</div>`).join('')}function cardex(){let gid=$('cg').value;if(!gid)return;$('cardlist').innerHTML=`<div class="sum">موجودی فعلی: <b>${M(ST(gid))}</b></div>`+D.stock.filter(x=>x.gid===gid).map(x=>`<div class="line">${x.date} — ورود ${M(x.qty)}</div>`).join('')+D.orders.flatMap(o=>(o.items||[]).filter(i=>i.gid===gid).map(i=>`<div class="line">${o.date} — خروج حواله ${M(o.no)}: ${M(i.qty)}</div>`)).join('')}function R(){$('orderslist').innerHTML=D.orders.slice().reverse().map(o=>`<div class="line"><b>حواله ${M(o.no)}</b> — ${o.date} — ${o.customer}<button onclick="loadO('${o.id}')">ویرایش</button><button class="r" onclick="deleteSavedOrder('${o.id}')">حذف</button></div>`).join('')||'حواله‌ای ثبت نشده';$('customerslist').innerHTML=D.customers.map(x=>`<div class="line"><b>${x.name}</b> — ${x.type==='cash'?'نقدی':'دفتر'} — مانده ${M(balanceOf(x.id))}<button onclick="editCust('${x.id}')">ویرایش</button><button class="r" onclick="deleteCust('${x.id}')">حذف</button></div>`).join('')||'مشتری ثبت نشده';$('driverslist').innerHTML=D.drivers.map(x=>`<div class="line"><b>${x.name}</b> — ${x.plate||''}<button onclick="editDrv('${x.id}')">ویرایش</button><button class="r" onclick="deleteDrv('${x.id}')">حذف</button></div>`).join('')||'راننده ثبت نشده';$('goodslist').innerHTML=D.goods.map(x=>`<div class="line"><b>${x.name}</b> — موجودی ${M(ST(x.id))}<button onclick="editGood('${x.id}')">ویرایش</button><button class="r" onclick="deleteGood('${x.id}')">حذف</button></div>`).join('')||'کالا ثبت نشده';$('financeList').innerHTML=D.finance.slice().reverse().map(x=>`<div class="line">${x.date} — ${D.customers.find(c=>c.id===x.cid)?.name||''} — ${x.type==='receive'?'دریافت':'پرداخت'} ${M(x.amount)}</div>`).join('')||'عملیات مالی ثبت نشده'}const LOGO_SVG=`<svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" aria-label="لوگو"><rect x="2" y="2" width="116" height="76" rx="10" fill="#111"/><path d="M18 58V35L38 18L58 35V58M58 58V29L79 12L102 29V58" fill="none" stroke="#d4af37" stroke-width="6" stroke-linejoin="round"/><path d="M25 58h70M31 42h12M68 39h12M84 51h12" stroke="#fff" stroke-width="4"/><rect x="50" y="43" width="9" height="15" fill="#d4af37"/></svg>`;
window.AUTH=sessionStorage.getItem('ahmadi_auth')||'';window.MANAGER=sessionStorage.getItem('ahmadi_manager')||'';
function basic(u,p){return btoa(unescape(encodeURIComponent(u+':'+p)))}
async function loadServer(){const r=await fetch('/api/state',{headers:{Authorization:'Basic '+window.AUTH},cache:'no-store'});if(!r.ok)throw new Error('unauthorized');const x=await r.json();['customers','drivers','goods','orders','stock','finance'].forEach(k=>D[k]=Array.isArray(x[k])?x[k]:[]);localStorage.setItem(K,JSON.stringify(D));}
async function doLogin(){const u=$('loginUser').value.trim(),p=$('loginPass').value;if(!u||!p)return;window.AUTH=basic(u,p);try{const r=await fetch('/api/state',{headers:{Authorization:'Basic '+window.AUTH},cache:'no-store'});if(!r.ok)throw 0;window.MANAGER=u;sessionStorage.setItem('ahmadi_auth',window.AUTH);sessionStorage.setItem('ahmadi_manager',u);const x=await r.json();['customers','drivers','goods','orders','stock','finance'].forEach(k=>D[k]=Array.isArray(x[k])?x[k]:[]);$('loginMask').style.display='none';$('managerBar').innerHTML='مدیر: '+u+' <button onclick="logout()">خروج</button>';fill();$('finDate').value=NOW();newOrder();R();loadApprovals()}catch(e){$('loginErr').textContent='نام کاربری یا رمز عبور اشتباه است';}}
function logout(){sessionStorage.removeItem('ahmadi_auth');sessionStorage.removeItem('ahmadi_manager');location.reload()}
async function loadApprovals(){if(!window.AUTH)return;try{const r=await fetch('/api/state',{headers:{Authorization:'Basic '+window.AUTH},cache:'no-store'});if(!r.ok)return;const x=await r.json();D.orders=x.orders||[];const a=D.orders.filter(o=>o.approvalStatus==='pending'||o.status==='pending');$('approvalList').innerHTML=a.length?a.slice().reverse().map(o=>`<div class="order"><b>حواله ${M(o.no)}</b> — ${o.date||''} — ${o.customer||''} — ${o.type==='cash'?'نقدی':'دفتر'}<div class="approvalActions"><button class="g" onclick="approveOrder('${o.id}','approved')">تأیید</button><button class="r" onclick="approveOrder('${o.id}','rejected')">رد</button></div></div>`).join(''):'سفارش در انتظار تأیید وجود ندارد';}catch(e){}}
async function approveOrder(id,status){if(MANAGER!=='m1'){alert('تأیید یا رد سفارش فقط با مدیر اول امکان‌پذیر است');return}const r=await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Basic '+window.AUTH},body:JSON.stringify({id,status})});if(!r.ok){alert('عملیات انجام نشد');return}await loadServer();R();loadApprovals();alert(status==='approved'?'سفارش تأیید شد':'سفارش رد شد')}

function printOrder(){let id=$('oid').value,o=D.orders.find(x=>x.id===id);if(!o)return alert('ابتدا حواله را ثبت کنید');$('print').innerHTML=`<div class="ah"><div class="hd"><div class="printLogo">${LOGO_SVG}<div class="printLogoText">مصالح ساختمانی احمدی</div></div><div class="slog">صورتحساب مشتری ${o.type==='cash'?'نقدی انبار':'دفتر'}</div><div class="ttl">حواله خروج کالا</div><div class="top"><div class="box">شماره: <b>${M(o.no)}</b></div><div class="box">تاریخ: <b>${o.date}</b></div></div><div class="people"><div class="person">مشتری: ${o.customer}</div><div class="person">راننده: ${o.driver||'—'}</div></div><div class="addr">آدرس: ${o.address||'—'}</div><table class="tbl"><tr><th>ردیف</th><th>کالا</th><th>تعداد</th><th>قیمت</th><th>جمع</th></tr>${o.items.map((i,k)=>`<tr><td>${k+1}</td><td>${D.goods.find(g=>g.id===i.gid)?.name||''}</td><td>${M(i.qty)}</td><td>${o.type==='cash'?M(i.price):'—'}</td><td>${o.type==='cash'?M(i.qty*i.price):'—'}</td></tr>`).join('')}</table><div class="totals"><div class="tbox">جمع: ${o.type==='cash'?M(o.total):'—'}</div><div class="tbox">پرداختی: ${M(o.payment)}</div></div><div class="notes">توضیحات: ${o.notes||''}</div><div class="signs"><div class="sign">امضاء راننده</div><div class="sign">امضاء خریدار</div><div class="sign">مهر انبار</div></div></div>`;window.print()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='پشتیبان-مصالح-احمدی.json';a.click()}function restoreData(){let f=$('restore').files[0];if(!f)return alert('فایل را انتخاب کنید');let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();R();alert('بازیابی شد')}catch(e){alert('فایل نامعتبر است')}};r.readAsText(f)}function init(){if(window.AUTH){doLogin()}else{$('loginMask').style.display='flex'}}addEventListener('DOMContentLoaded',init);</script></body></html>
