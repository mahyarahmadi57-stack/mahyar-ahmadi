<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مصالح ساختمانی احمدی</title><style>body{font-family:Tahoma;margin:0;background:#f4f5f7;color:#17212b}header{background:#173f73;color:white;text-align:center;padding:15px}nav{display:flex;overflow:auto;gap:6px;background:white;padding:8px}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #ccd4dd;border-radius:7px}button{font-weight:bold}.p{background:#173f73;color:white}.g{background:#167542;color:white}.r{background:#a42a2a;color:white}main{max-width:1000px;margin:auto;padding:10px}.page{display:none}.active{display:block}.card,.slip{background:white;padding:14px;border-radius:10px;margin-bottom:10px}.slip{border:2px solid #173f73}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}label{font-size:13px;font-weight:bold;display:block;margin-bottom:4px}.item{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:5px;margin:6px 0}.box{background:#eef4f9;padding:10px;border-radius:7px;margin:8px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.line{padding:10px;border:1px solid #d5dde5;border-radius:8px;margin:7px 0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccd4dd;padding:7px;text-align:center}.hide{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item select{grid-column:1/-1}}@media print{header,nav,.no-print,.actions{display:none!important}.page{display:none!important}#order{display:block!important}.slip{border:1px solid #000}}</style></head><body>
<header><h2>مصالح ساختمانی احمدی</h2><small>مدیریت انبار و حواله</small></header>
<nav class="no-print"><button onclick="go('order')">ثبت سفارش</button><button onclick="go('orders')">حواله‌ها</button><button onclick="go('customers')">مشتریان</button><button onclick="go('drivers')">رانندگان</button><button onclick="go('goods')">کالا و انبار</button><button onclick="go('cardex')">کاردکس</button><button onclick="go('backup')">پشتیبان</button></nav>
<main>
<section id="order" class="page active"><div class="slip"><h2 style="text-align:center">مصالح ساختمانی احمدی</h2><h3 style="text-align:center">حواله خروج کالا</h3><input id="oid" type="hidden"><div class="grid"><div><label>نوع مشتری</label><select id="type" onchange="typeChange()"><option value="cash">مشتری نقدی انبار</option><option value="office">مشتری دفتر</option></select></div><div><label>شماره حواله</label><input id="no" readonly></div><div><label>تاریخ و ساعت</label><input id="date" readonly></div><div><label>مشتری</label><select id="customer" onchange="custChange()"></select></div><div><label>موبایل</label><input id="mobile" readonly></div><div><label>آدرس</label><input id="address" readonly></div></div><div id="driverbox" class="grid"><div><label>راننده</label><select id="driver" onchange="driverChange()"></select></div><div><label>پلاک</label><input id="plate" readonly></div></div><h3>کالاها</h3><div id="items"></div><button class="g no-print" onclick="addItem()">+ افزودن کالا</button><div id="cashbox" class="box"><div class="grid"><div>جمع کل: <b id="total">۰</b></div><div>بدهی قبلی: <b id="olddebt">۰</b></div><div><label>مبلغ پرداختی</label><input id="payment" type="number" inputmode="numeric" oninput="calc()"></div><div>مانده حساب: <b id="balance">۰</b></div></div></div><label>توضیحات</label><textarea id="notes" rows="3"></textarea><div class="actions no-print"><button class="p" onclick="saveOrder()">ثبت / اصلاح</button><button class="g" onclick="printOrder()">چاپ حواله</button><button class="r" onclick="deleteCurrent()">حذف</button><button onclick="newOrder()">سفارش جدید</button></div></div></section>
<section id="orders" class="page"><div class="card"><h2>حواله‌ها</h2><div id="orderslist"></div></div></section>
<section id="customers" class="page"><div class="card"><h2>مشتری</h2><input id="cid" type="hidden"><div class="grid"><div><label>نام</label><input id="cname"></div><div><label>نوع</label><select id="ctype"><option value="cash">نقدی</option><option value="office">دفتر</option></select></div><div><label>موبایل</label><input id="cmobile"></div><div><label>آدرس</label><input id="caddress"></div></div><div class="actions"><button class="p" onclick="saveCustomer()">ذخیره</button><button onclick="clearCustomer()">جدید</button></div></div><div class="card" id="customerslist"></div></section>
<section id="drivers" class="page"><div class="card"><h2>راننده</h2><input id="did" type="hidden"><div class="grid"><div><label>نام</label><input id="dname"></div><div><label>موبایل</label><input id="dmobile"></div><div class="full"><label>پلاک کامل</label><input id="dplate"></div></div><div class="actions"><button class="p" onclick="saveDriver()">ذخیره</button><button onclick="clearDriver()">جدید</button></div></div><div class="card" id="driverslist"></div></section>
<section id="goods" class="page"><div class="card"><h2>کالا</h2><input id="gid" type="hidden"><div class="grid"><div><label>نام کالا</label><input id="gname"></div><div><label>واحد</label><input id="gunit"></div><div><label>موجودی اول دوره</label><input id="gopen" type="number"></div></div><div class="actions"><button class="p" onclick="saveGood()">ذخیره</button><button onclick="clearGood()">جدید</button></div></div><div class="card"><h3>ورود کالا</h3><select id="ingood"></select><input id="inqty" type="number" placeholder="تعداد"><button class="g" onclick="stockIn()">ثبت ورود</button></div><div class="card" id="goodslist"></div></section>
<section id="cardex" class="page"><div class="card"><h2>کاردکس</h2><select id="cardgood" onchange="cardex()"></select><div id="cardlist"></div></div></section>
<section id="backup" class="page"><div class="card"><h2>پشتیبان</h2><button class="p" onclick="backup()">دریافت پشتیبان</button><input id="restorefile" type="file" accept=".json"><button class="g" onclick="restore()">بازیابی</button></div></section>
</main>
<script>
let db=JSON.parse(localStorage.getItem("ahmadiApp")||"{}");for(let k of["customers","drivers","goods","orders","ins"])if(!Array.isArray(db[k]))db[k]=[];let items=[];const $=x=>document.getElementById(x),N=x=>Number(x)||0,I=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),M=x=>N(x).toLocaleString("fa-IR"),FD=()=>new Intl.DateTimeFormat("fa-IR-u-ca-persian",{dateStyle:"short",timeStyle:"short"}).format(new Date());function save(){localStorage.setItem("ahmadiApp",JSON.stringify(db));renderAll()}function go(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(p).classList.add("active");if(p==="cardex")cardex()}function next(){return db.orders.reduce((m,x)=>Math.max(m,N(x.no)),0)+1}function stock(g){let a=db.goods.find(x=>x.id===g),v=N(a?.opening);v+=db.ins.filter(x=>x.gid===g).reduce((s,x)=>s+N(x.qty),0);v-=db.orders.reduce((s,o)=>s+o.items.filter(x=>x.gid===g).reduce((z,x)=>z+N(x.qty),0),0);return v}function debt(c,ex=""){return db.orders.filter(o=>o.id!==ex&&o.type==="cash"&&o.cid===c).reduce((s,o)=>s+N(o.total)-N(o.payment),0)}
function selects(){let t=$("type").value;$("customer").innerHTML='<option value="">انتخاب مشتری</option>'+db.customers.filter(x=>x.type===t).map(x=>`<option value="${x.id}">${x.name}</option>`).join("");$("driver").innerHTML='<option value="">انتخاب راننده</option>'+db.drivers.map(x=>`<option value="${x.id}">${x.name} - ${x.plate||""}</option>`).join("");let o='<option value="">انتخاب کالا</option>'+db.goods.map(x=>`<option value="${x.id}">${x.name} (${stock(x.id)})</option>`).join("");$("ingood").innerHTML=o;$("cardgood").innerHTML=o}
function typeChange(){let c=$("type").value==="cash";$("driverbox").classList.toggle("hide",c);$("cashbox").classList.toggle("hide",!c);selects();renderItems();calc()}function custChange(){let c=db.customers.find(x=>x.id==$("customer").value);$("mobile").value=c?.mobile||"";$("address").value=c?.address||"";calc()}function driverChange(){let d=db.drivers.find(x=>x.id==$("driver").value);$("plate").value=d?.plate||""}
function addItem(){items.push({gid:"",qty:"",price:""});renderItems()}function lastPrice(g){for(let i=db.orders.length-1;i>=0;i--){let a=db.orders[i].items.find(x=>x.gid===g);if(a&&db.orders[i].type==="cash")return a.price}return""}
function renderItems(){$("items").innerHTML="";let cash=$("type").value==="cash";items.forEach((x,i)=>{let r=document.createElement("div");r.className="item";let s=document.createElement("select");s.innerHTML='<option value="">کالا</option>'+db.goods.map(g=>`<option value="${g.id}" ${x.gid===g.id?"selected":""}>${g.name}</option>`).join("");s.onchange=()=>{items[i].gid=s.value;items[i].price=cash?lastPrice(s.value):"";renderItems()};let q=document.createElement("input");q.type="number";q.inputMode="numeric";q.placeholder="تعداد";q.value=x.qty;q.oninput=()=>{items[i].qty=q.value;calc()};let p=document.createElement("input");p.type="number";p.inputMode="numeric";p.placeholder="قیمت واحد";p.value=x.price;p.disabled=!cash;p.oninput=()=>{items[i].price=p.value;calc()};let a=document.createElement("div");a.className="box";a.textContent=M(N(x.qty)*N(x.price));let b=document.createElement("button");b.textContent="حذف";b.className="r";b.onclick=()=>{items.splice(i,1);renderItems()};r.append(s,q,p,a,b);$("items").append(r)});calc()}
function calc(){let t=items.reduce((s,x)=>s+N(x.qty)*N(x.price),0),c=$("customer").value,o=c?debt(c,$("oid").value):0;$("total").textContent=M(t);$("olddebt").textContent=M(o);$("balance").textContent=M(o+t-N($("payment").value))}
function newOrder(){$("oid").value="";$("no").value="حواله شماره "+next();$("date").value=FD();$("type").value="cash";$("payment").value="";$("notes").value="";items=[];$("mobile").value="";$("address").value="";selects();typeChange()}
function saveOrder(){let c=db.customers.find(x=>x.id==$("customer").value);if(!c)return alert("مشتری را انتخاب کنید");if(!items.length)return alert("کالا وارد کنید");for(let x of items){if(!x.gid||N(x.qty)<=0)return alert("کالا و تعداد را کامل کنید");if($("type").value==="cash"&&x.price==="")return alert("قیمت را وارد کنید")}let old=db.orders.find(x=>x.id==$("oid").value),d=db.drivers.find(x=>x.id==$("driver").value),its=items.map(x=>{let g=db.goods.find(a=>a.id===x.gid);return{gid:x.gid,name:g.name,unit:g.unit,qty:N(x.qty),price:$("type").value==="cash"?N(x.price):""}}),o={id:old?.id||I(),no:old?.no||next(),date:$("date").value,type:$("type").value,cid:c.id,customer:c.name,mobile:c.mobile,address:c.address,did:d?.id||"",driver:d?.name||"",plate:d?.plate||"",items:its,total:$("type").value==="cash"?its.reduce((s,x)=>s+N(x.qty)*N(x.price),0):"",payment:$("type").value==="cash"?N($("payment").value):"",notes:$("notes").value};let i=db.orders.findIndex(x=>x.id===o.id);if(i<0)db.orders.push(o);else db.orders[i]=o;$("oid").value=o.id;$("no").value="حواله شماره "+o.no;save();alert("ثبت شد")}
function loadOrder(i){let o=db.orders.find(x=>x.id===i);go("order");$("oid").value=o.id;$("no").value="حواله شماره "+o.no;$("date").value=o.date;$("type").value=o.type;selects();$("customer").value=o.cid;$("driver").value=o.did;items=o.items.map(x=>({gid:x.gid,qty:x.qty,price:x.price}));$("payment").value=o.payment||"";$("notes").value=o.notes||"";typeChange();$("customer").value=o.cid;$("driver").value=o.did;custChange();driverChange();renderItems()}
function deleteCurrent(){if($("oid").value&&confirm("حذف شود؟")){db.orders=db.orders.filter(x=>x.id!==$("oid").value);save();newOrder()}}function printOrder(){if(!$("oid").value)return alert("ابتدا ثبت کنید");window.print()}
function saveCustomer(){let x={id:$("cid").value||I(),name:$("cname").value,type:$("ctype").value,mobile:$("cmobile").value,address:$("caddress").value};if(!x.name)return alert("نام لازم است");let i=db.customers.findIndex(a=>a.id===x.id);i<0?db.customers.push(x):db.customers[i]=x;save();clearCustomer()}function clearCustomer(){$("cid").value="";$("cname").value="";$("cmobile").value="";$("caddress").value=""}function editCustomer(i){let x=db.customers.find(a=>a.id===i);$("cid").value=x.id;$("cname").value=x.name;$("ctype").value=x.type;$("cmobile").value=x.mobile;$("caddress").value=x.address;go("customers")}function delCustomer(i){if(confirm("حذف؟")){db.customers=db.customers.filter(x=>x.id!==i);save()}}
function saveDriver(){let x={id:$("did").value||I(),name:$("dname").value,mobile:$("dmobile").value,plate:$("dplate").value};if(!x.name)return alert("نام لازم است");let i=db.drivers.findIndex(a=>a.id===x.id);i<0?db.drivers.push(x):db.drivers[i]=x;save();clearDriver()}function clearDriver(){$("did").value="";$("dname").value="";$("dmobile").value="";$("dplate").value=""}function editDriver(i){let x=db.drivers.find(a=>a.id===i);$("did").value=x.id;$("dname").value=x.name;$("dmobile").value=x.mobile;$("dplate").value=x.plate;go("drivers")}function delDriver(i){if(confirm("حذف؟")){db.drivers=db.drivers.filter(x=>x.id!==i);save()}}
function saveGood(){let x={id:$("gid").value||I(),name:$("gname").value,unit:$("gunit").value||"عدد",opening:N($("gopen").value)};if(!x.name)return alert("نام لازم است");let i=db.goods.findIndex(a=>a.id===x.id);i<0?db.goods.push(x):db.goods[i]=x;save();clearGood()}function clearGood(){$("gid").value="";$("gname").value="";$("gunit").value="";$("gopen").value=""}function editGood(i){let x=db.goods.find(a=>a.id===i);$("gid").value=x.id;$("gname").value=x.name;$("gunit").value=x.unit;$("gopen").value=x.opening;go("goods")}function delGood(i){if(confirm("حذف؟")){db.goods=db.goods.filter(x=>x.id!==i);db.ins=db.ins.filter(x=>x.gid!==i);save()}}
function stockIn(){let g=$("ingood").value,q=N($("inqty").value);if(!g||q<=0)return alert("کالا و تعداد را وارد کنید");db.ins.push({id:I(),gid:g,qty:q,date:FD()});$("inqty").value="";save()}
function cardex(){let g=$("cardgood").value;if(!g){$("cardlist").innerHTML="کالا را انتخاب کنید";return}let x=db.goods.find(a=>a.id===g),r=[["اول دوره","اول دوره",N(x.opening),0]];db.ins.filter(a=>a.gid===g).forEach(a=>r.push([a.date,"ورود",N(a.qty),0]));db.orders.forEach(o=>o.items.filter(a=>a.gid===g).forEach(a=>r.push([o.date,"خروج حواله "+o.no,0,N(a.qty)]));let b=0;$("cardlist").innerHTML='<table><tr><th>تاریخ</th><th>شرح</th><th>ورودی</th><th>خروجی</th><th>مانده</th></tr>'+r.map(a=>{b+=a[2]-a[3];return`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]||"-"}</td><td>${a[3]||"-"}</td><td>${b}</td></tr>`}).join("")+"</table>"}
function renderAll(){selects();$("customerslist").innerHTML=db.customers.map(x=>`<div class="line"><b>${x.name}</b><div class="actions"><button onclick="editCustomer('${x.id}')">اصلاح</button><button class="r" onclick="delCustomer('${x.id}')">حذف</button></div></div>`).join("")||"موردی نیست";$("driverslist").innerHTML=db.drivers.map(x=>`<div class="line"><b>${x.name}</b> | ${x.plate||""}<div class="actions"><button onclick="editDriver('${x.id}')">اصلاح</button><button class="r" onclick="delDriver('${x.id}')">حذف</button></div></div>`).join("")||"موردی نیست";$("goodslist").innerHTML='<table><tr><th>کالا</th><th>واحد</th><th>اول دوره</th><th>موجودی</th><th>عملیات</th></tr>'+db.goods.map(x=>`<tr><td>${x.name}</td><td>${x.unit}</td><td>${x.opening}</td><td>${stock(x.id)}</td><td><button onclick="editGood('${x.id}')">اصلاح</button><button class="r" onclick="delGood('${x.id}')">حذف</button></td></tr>`).join("")+"</table>";$("orderslist").innerHTML=db.orders.slice().sort((a,b)=>b.no-a.no).map(x=>`<div class="line"><b>حواله ${x.no}</b> | ${x.customer}<div class="actions"><button onclick="loadOrder('${x.id}')">اصلاح / مشاهده</button><button class="r" onclick="delOrder('${x.id}')">حذف</button></div></div>`).join("")||"حواله‌ای نیست"}function delOrder(i){if(confirm("حذف؟")){db.orders=db.orders.filter(x=>x.id!==i);save();newOrder()}}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"}));a.download="backup-ahmadi.json";a.click()}function restore(){let f=$("restorefile").files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);save();newOrder();alert("بازیابی شد")};r.readAsText(f)}
newOrder();renderAll();
</script></body></html>
