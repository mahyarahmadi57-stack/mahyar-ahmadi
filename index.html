value=keep;if(keep)customerLedger()}function numWords(n){n=Math.floor(Math.abs(Number(n)||0));if(n===0)return 'صفر';const u=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];const t=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];const h=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];const scales=['','هزار','میلیون','میلیارد','تریلیون'];function tri(x){let a=[];if(x>=100){a.push(h[Math.floor(x/100)]);x%=100;if(x)a.push('و')}if(x>=20){a.push(t[Math.floor(x/10)]);x%=10;if(x)a.push('و')}if(x){a.push(u[x])}return a.join(' ')}let parts=[],i=0;while(n>0){let x=n%1000;if(x)parts.unshift(tri(x)+(scales[i]?' '+scales[i]:''));n=Math.floor(n/1000);i++}return parts.join(' و ')}function formatMoney(el){let n=N(el.value);el.value=n?M(n):'';let w=el.parentElement.querySelector('.moneyWords');if(w)w.textContent=n?numWords(n)+' تومان':''}function wireMoneyInputs(){document.querySelectorAll('input[inputmode="numeric"]').forEach(el=>{if(el.dataset.moneywired)return;el.dataset.moneywired='1';el.addEventListener('blur',()=>formatMoney(el))})}function enableUnlimitedNumbers(){document.querySelectorAll('input[inputmode="numeric"]').forEach(el=>{el.removeAttribute("maxlength");el.removeAttribute("max");el.maxLength=524288})}
